name: weaves-personal
x-runtime: &runtime
  DATABASE_URL: postgresql://weaves:${POSTGRES_PASSWORD:?required}@postgres:5432/weaves
  WEAVES_SECRET_ENCRYPTION_KEY: ${WEAVES_SECRET_ENCRYPTION_KEY:?required}
  WEAVES_DB_POOL_MAX_SIZE: "4"
  WEAVES_SEED_LOCAL_DEFAULTS: "false"
  WEAVES_HTTP_MAX_CONNECTIONS: "20"
  WEAVES_HTTP_MAX_KEEPALIVE_CONNECTIONS: "10"
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weaves
      POSTGRES_USER: weaves
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U weaves -d weaves"]
      interval: 5s
      timeout: 3s
      retries: 20
  product-api:
    <<: *defaults
    build: ../../..
    image: weaves-personal-backend:local
    environment:
      <<: *runtime
      WEAVES_PUBLIC_FRONTEND_URL: http://localhost:18080
      WEAVES_PUBLIC_API_BASE_URL: http://localhost:18080
      CORS_ORIGINS: http://localhost:18080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v0/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  product-worker:
    <<: *defaults
    image: weaves-personal-backend:local
    command: python -m apps.worker.main
    environment:
      <<: *runtime
      WEAVES_WORKER_POLL_SECONDS: "3"
    depends_on:
      product-api:
        condition: service_healthy
  frontend:
    <<: *defaults
    build: ../../../../weaves-app
    environment:
      WEAVES_API_BASE: /api/v0
      WEAVES_PUBLIC_REGISTRATION: "false"
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      product-api:
        condition: service_healthy
volumes:
  database:
