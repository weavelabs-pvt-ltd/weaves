name: weaves-single
x-runtime: &runtime
  DATABASE_URL: postgresql://weaves:${POSTGRES_PASSWORD:?required}@postgres:5432/weaves
  WEAVES_SECRET_ENCRYPTION_KEY: ${WEAVES_SECRET_ENCRYPTION_KEY:?required}
  WEAVES_DB_POOL_MAX_SIZE: "4"
  WEAVES_SEED_LOCAL_DEFAULTS: "false"
  # Opt in to PostgreSQL row-level security by setting weaves_app in runtime.env.
  WEAVES_DB_APP_ROLE: ${WEAVES_DB_APP_ROLE:-}
  WEAVES_HTTP_MAX_CONNECTIONS: "20"
  WEAVES_HTTP_MAX_KEEPALIVE_CONNECTIONS: "10"
  # Tenant limits. observe logs would-be refusals and changes nothing; set enforce in
  # runtime.env after reading the log, and off to disable. The pause switch refuses
  # new work only. Per-organization overrides use organization_limits.py.
  WEAVES_LIMITS_MODE: ${WEAVES_LIMITS_MODE:-observe}
  WEAVES_ADMISSIONS_PAUSED: ${WEAVES_ADMISSIONS_PAUSED:-false}
# Connector settings. Empty values are harmless: the connector is then reported
# as unavailable. The API starts OAuth flows and handles provider callbacks;
# the worker refreshes tokens and mints runtime credentials, so it needs the
# provider credentials too, but not the public URLs.
x-connectors-worker: &connectors_worker
  WEAVES_GITHUB_APP_ID: ${WEAVES_GITHUB_APP_ID:-}
  WEAVES_GITHUB_APP_PRIVATE_KEY: ${WEAVES_GITHUB_APP_PRIVATE_KEY:-}
  WEAVES_SLACK_OAUTH_CLIENT_ID: ${WEAVES_SLACK_OAUTH_CLIENT_ID:-}
  WEAVES_SLACK_OAUTH_CLIENT_SECRET: ${WEAVES_SLACK_OAUTH_CLIENT_SECRET:-}
  WEAVES_ATLASSIAN_OAUTH_CLIENT_ID: ${WEAVES_ATLASSIAN_OAUTH_CLIENT_ID:-}
  WEAVES_ATLASSIAN_OAUTH_CLIENT_SECRET: ${WEAVES_ATLASSIAN_OAUTH_CLIENT_SECRET:-}
  WEAVES_MCP_ALLOWED_HOSTS: ${WEAVES_MCP_ALLOWED_HOSTS:-}
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weaves
      POSTGRES_USER: weaves
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U weaves -d weaves"]
      interval: 5s
      timeout: 3s
      retries: 20
  product-api:
    <<: *defaults
    image: ${BACKEND_IMAGE:?required}
    command: uvicorn apps.api.app:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    environment:
      <<: [*runtime, *connectors_worker]
      WEAVES_GITHUB_APP_CLIENT_ID: ${WEAVES_GITHUB_APP_CLIENT_ID:-}
      WEAVES_GITHUB_APP_CLIENT_SECRET: ${WEAVES_GITHUB_APP_CLIENT_SECRET:-}
      WEAVES_GITHUB_APP_SLUG: ${WEAVES_GITHUB_APP_SLUG:-}
      WEAVES_BROWSER_SESSION_SECRET: ${WEAVES_BROWSER_SESSION_SECRET:-}
      # Google is the only sign-in method; leave the client unset to disable it.
      WEAVES_GOOGLE_CLIENT_ID: ${WEAVES_GOOGLE_CLIENT_ID:-}
      WEAVES_GOOGLE_CLIENT_SECRET: ${WEAVES_GOOGLE_CLIENT_SECRET:-}
      WEAVES_ACCOUNT_ALLOWED_EMAILS: ${WEAVES_ACCOUNT_ALLOWED_EMAILS:-}
      WEAVES_ACCOUNT_ALLOWED_EMAIL_DOMAINS: ${WEAVES_ACCOUNT_ALLOWED_EMAIL_DOMAINS:-}
      WEAVES_ALLOW_ACCOUNT_ORGANIZATION_CREATION: ${WEAVES_ALLOW_ACCOUNT_ORGANIZATION_CREATION:-false}
      WEAVES_ACCOUNT_ORGANIZATION_LIMIT: ${WEAVES_ACCOUNT_ORGANIZATION_LIMIT:-3}
      WEAVES_PUBLIC_FRONTEND_URL: https://app.weave-studio.in
      WEAVES_PUBLIC_API_BASE_URL: https://api.weave-studio.in
      CORS_ORIGINS: https://app.weave-studio.in
    ports:
      - 127.0.0.1:8001:8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v0/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  product-worker:
    <<: *defaults
    image: ${BACKEND_IMAGE:?required}
    command: python -m apps.worker.main
    environment:
      <<: [*runtime, *connectors_worker]
      WEAVES_WORKER_POLL_SECONDS: "3"
      WEAVES_WAITLIST_RETENTION_DAYS: ${WEAVES_WAITLIST_RETENTION_DAYS:-365}
    depends_on:
      product-api:
        condition: service_healthy
  frontend:
    <<: *defaults
    image: ${FRONTEND_IMAGE:?required}
    environment:
      WEAVES_API_BASE: /api/v0
      WEAVES_PUBLIC_REGISTRATION: "false"
      WEAVES_APP_ORIGIN: https://app.weave-studio.in
      WEAVES_WEBSITE_ORIGIN: https://weave-studio.in
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      product-api:
        condition: service_healthy
  gateway:
    <<: *defaults
    image: caddy:2-alpine
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - gateway_config:/config
    depends_on:
      - frontend
volumes:
  database:
  certificates:
  gateway_config:
