services:
  product-api:
    restart: unless-stopped
    build: .
    command: uvicorn apps.api.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://weaves:weaves@postgres:5432/weaves
      WEAVES_API_TOKEN: ${WEAVES_API_TOKEN:-}
      WEAVES_API_TOKENS: ${WEAVES_API_TOKENS:-}
      WEAVES_SECRET_ENCRYPTION_KEY: ${WEAVES_SECRET_ENCRYPTION_KEY:-}
      WEAVES_SSO_SESSION_SECRET: ${WEAVES_SSO_SESSION_SECRET:-}
      WEAVES_SSO_GOOGLE_CLIENT_ID: ${WEAVES_SSO_GOOGLE_CLIENT_ID:-}
      WEAVES_SSO_GOOGLE_CLIENT_SECRET: ${WEAVES_SSO_GOOGLE_CLIENT_SECRET:-}
      WEAVES_SSO_MICROSOFT_CLIENT_ID: ${WEAVES_SSO_MICROSOFT_CLIENT_ID:-}
      WEAVES_SSO_MICROSOFT_CLIENT_SECRET: ${WEAVES_SSO_MICROSOFT_CLIENT_SECRET:-}
      WEAVES_SSO_MICROSOFT_TENANT_ID: ${WEAVES_SSO_MICROSOFT_TENANT_ID:-}
      WEAVES_SSO_MICROSOFT_SUBJECTS: ${WEAVES_SSO_MICROSOFT_SUBJECTS:-}
      WEAVES_SSO_ZOHO_CLIENT_ID: ${WEAVES_SSO_ZOHO_CLIENT_ID:-}
      WEAVES_SSO_ZOHO_CLIENT_SECRET: ${WEAVES_SSO_ZOHO_CLIENT_SECRET:-}
      WEAVES_EMAIL_LOGIN_HMAC_KEY: ${WEAVES_EMAIL_LOGIN_HMAC_KEY:-}
      WEAVES_AUTH_EMAIL_CONSOLE: ${WEAVES_AUTH_EMAIL_CONSOLE:-false}
      WEAVES_SMTP_HOST: ${WEAVES_SMTP_HOST:-}
      WEAVES_SMTP_PORT: ${WEAVES_SMTP_PORT:-587}
      WEAVES_SMTP_FROM: ${WEAVES_SMTP_FROM:-}
      WEAVES_SMTP_USERNAME: ${WEAVES_SMTP_USERNAME:-}
      WEAVES_SMTP_PASSWORD: ${WEAVES_SMTP_PASSWORD:-}
      WEAVES_SMTP_STARTTLS: ${WEAVES_SMTP_STARTTLS:-true}
      WEAVES_MCP_ALLOWED_HOSTS: ${WEAVES_MCP_ALLOWED_HOSTS:-}
      WEAVES_PUBLIC_API_BASE_URL: ${WEAVES_PUBLIC_API_BASE_URL:-http://localhost:8001}
      WEAVES_PUBLIC_FRONTEND_URL: ${WEAVES_PUBLIC_FRONTEND_URL:-http://localhost:8080}
      WEAVES_GITHUB_APP_ID: ${WEAVES_GITHUB_APP_ID:-}
      WEAVES_GITHUB_APP_SLUG: ${WEAVES_GITHUB_APP_SLUG:-}
      WEAVES_GITHUB_APP_CLIENT_ID: ${WEAVES_GITHUB_APP_CLIENT_ID:-}
      WEAVES_GITHUB_APP_CLIENT_SECRET: ${WEAVES_GITHUB_APP_CLIENT_SECRET:-}
      WEAVES_GITHUB_APP_PRIVATE_KEY: ${WEAVES_GITHUB_APP_PRIVATE_KEY:-}
      WEAVES_SLACK_OAUTH_CLIENT_ID: ${WEAVES_SLACK_OAUTH_CLIENT_ID:-}
      WEAVES_SLACK_OAUTH_CLIENT_SECRET: ${WEAVES_SLACK_OAUTH_CLIENT_SECRET:-}
      WEAVES_ATLASSIAN_OAUTH_CLIENT_ID: ${WEAVES_ATLASSIAN_OAUTH_CLIENT_ID:-}
      WEAVES_ATLASSIAN_OAUTH_CLIENT_SECRET: ${WEAVES_ATLASSIAN_OAUTH_CLIENT_SECRET:-}
      MODEL_PROVIDER_TYPE: ${MODEL_PROVIDER_TYPE:-openai}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v0/health', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  product-worker:
    restart: unless-stopped
    build: .
    command: python -m apps.worker.main
    environment:
      DATABASE_URL: postgresql://weaves:weaves@postgres:5432/weaves
      WEAVES_SECRET_ENCRYPTION_KEY: ${WEAVES_SECRET_ENCRYPTION_KEY:-}
      WEAVES_MCP_ALLOWED_HOSTS: ${WEAVES_MCP_ALLOWED_HOSTS:-}
      WEAVES_GITHUB_APP_ID: ${WEAVES_GITHUB_APP_ID:-}
      WEAVES_GITHUB_APP_PRIVATE_KEY: ${WEAVES_GITHUB_APP_PRIVATE_KEY:-}
      WEAVES_SLACK_OAUTH_CLIENT_ID: ${WEAVES_SLACK_OAUTH_CLIENT_ID:-}
      WEAVES_SLACK_OAUTH_CLIENT_SECRET: ${WEAVES_SLACK_OAUTH_CLIENT_SECRET:-}
      WEAVES_ATLASSIAN_OAUTH_CLIENT_ID: ${WEAVES_ATLASSIAN_OAUTH_CLIENT_ID:-}
      WEAVES_ATLASSIAN_OAUTH_CLIENT_SECRET: ${WEAVES_ATLASSIAN_OAUTH_CLIENT_SECRET:-}
      MODEL_PROVIDER_TYPE: ${MODEL_PROVIDER_TYPE:-openai}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4o-mini}
      WEAVES_WORKER_POLL_SECONDS: ${WEAVES_WORKER_POLL_SECONDS:-1}
    depends_on:
      product-api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weaves
      POSTGRES_USER: weaves
      POSTGRES_PASSWORD: weaves
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - weaves-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weaves -d weaves"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  weaves-postgres:
