[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = [
  "shared",
  "contracts",
  "infrastructure",
  "clients",
  "modules",
  "application",
  "apps",
]
