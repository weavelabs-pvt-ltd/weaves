[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D", "C90"]
# These rules fight the formatter or the Google convention it is configured for.
ignore = ["D203", "D206", "D300", "COM812"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests assert behavior; they are not a public API surface.
"tests/**/*.py" = ["D"]
# Existing debt. Remove a file once it satisfies the listed rules.
# Do not add a path to hide a violation from new work.
"application/platform.py" = ["B904", "B905", "C901", "D101", "D102"]
"apps/cli/main.py" = ["D103"]
