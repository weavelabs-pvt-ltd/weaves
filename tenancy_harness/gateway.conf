server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control no-store always;
    location = /healthz { return 200 'ok'; }
    location = /config.js { alias /tmp/config.js; }
    location /api/v0/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8000;
    }
    # The fake Google authorize endpoint is the only provider path a browser reaches.
    location = /fake-google/identity {
        proxy_set_header Host provider;
        proxy_pass http://provider:8081/google/identity;
    }
    location = /fake-google/authorize {
        proxy_set_header Host provider;
        proxy_pass http://provider:8081/google/authorize;
    }
    location / { try_files $uri $uri/ =404; }
}
