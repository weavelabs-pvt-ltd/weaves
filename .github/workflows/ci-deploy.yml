name: Backend CI and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older runs; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: weaves_test
          POSTGRES_USER: weaves
          POSTGRES_PASSWORD: weaves
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weaves -d weaves_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WEAVES_TEST_DATABASE_URL: postgresql://weaves:weaves@127.0.0.1:5432/weaves_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_python_size.py
      - run: mypy
      - run: pytest
      - run: docker build -t weaves-backend-ci .

  tenancy:
    name: Phase 0 real-stack tenancy foundation
    # Heavy (10 to 15 minutes): proven on the pull request; not repeated on the merge commit to main.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: backend
          persist-credentials: false
      - name: Read the exact counterpart revision
        id: pair
        working-directory: backend
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          pair = json.load(open('tenancy_harness/pair.json'))['frontend']
          assert re.fullmatch(r'[a-f0-9]{40}', pair['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository=' + pair['repository'] + '\n')
              output.write('revision=' + pair['revision'] + '\n')
          PYTHON
      - name: Require read access to the private frontend fixture
        env:
          READ_TOKEN: ${{ secrets.TENANCY_FRONTEND_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::error::Set TENANCY_FRONTEND_READ_TOKEN with Contents read on weaves-app; private fixture access is required."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.pair.outputs.repository }}
          ref: ${{ steps.pair.outputs.revision }}
          path: frontend
          persist-credentials: false
          token: ${{ secrets.TENANCY_FRONTEND_READ_TOKEN }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run real PostgreSQL, API, worker and browser cases
        working-directory: backend
        run: |
          python3 -m tenancy_harness.run --backend "$GITHUB_WORKSPACE/backend" \
            --frontend "$GITHUB_WORKSPACE/frontend" --candidate backend \
            --output "$RUNNER_TEMP/tenancy"
      - name: Publish credential-free tenancy evidence only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-tenancy-phase-0
          path: ${{ runner.temp }}/tenancy/artifacts/
          retention-days: 7

  deploy:
    # Real-stack tenancy is skipped on pushes to main (it passed on the pull request); it must never have failed.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.result == 'success' && (needs.tenancy.result == 'success' || needs.tenancy.result == 'skipped') }}
    needs: [verify, tenancy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: backend-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check current main revision
        id: head
        run: echo "current=$(test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA" && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        if: steps.head.outputs.current == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
        if: steps.head.outputs.current == 'true'
      - name: Configure registry authentication
        if: steps.head.outputs.current == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.head.outputs.current == 'true'
      - name: Build and publish immutable backend image
        id: build
        if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Deploy API and worker to the existing VM
        if: steps.head.outputs.current == 'true'
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend@${{ steps.build.outputs.digest }}
          DEPLOY_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        run: |
          set -euo pipefail
          if [ "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "A newer main commit exists; skipping this release."
            exit 0
          fi
          python3 infra/gcp/singlevm/deploy.py --component backend --image "$IMAGE" \
            --revision "$GITHUB_SHA" --project "$PROJECT_ID" --account "$DEPLOY_ACCOUNT" \
            --zone "$VM_ZONE" --vm "$VM_NAME"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://api.weave-studio.in/api/v0/health
      - name: Record release manifest line
        if: steps.head.outputs.current == 'true'
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend@${{ steps.build.outputs.digest }}
        run: |
          printf '{"component":"backend","image":"%s","revision":"%s","time":"%s"}\n' \
            "$IMAGE" "$GITHUB_SHA" "$(date -u +%FT%TZ)" | tee release-manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: steps.head.outputs.current == 'true'
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 90
